uld match sum of all individual balances\r\n\r\n  @Accounts @AccountDetails\r\n  Scenario: Verify account details page\r\n    When user clicks an account number\r\n    Then Account Details page should be displayed\r\n    And correct account number should be shown\r\n\r\n  @Accounts @DefaultAccount\r\n  Scenario: Verify default account remains available\r\n    When user creates multiple accounts\r\n    Then default account should still be available\r\n\r\n  @Accounts @BalanceValidation\r\n  Scenario:  Verify newly created account has valid balance\r\n    When user opens account details\r\n    Then account balance should be displayed\r\n    And balance should be greater than or equal to zero\r\n\r\n  @Negative @Validation\r\n  Scenario: Verify invalid account type is not allowed\r\n    When user attempts to create an account with invalid account type\r\n    Then account creation should be prevented\r\n\r\n  @Negative @Security\r\n  Scenario:  Verify account creation page requires authentication\r\n    When user accesses Open Account page without login\r\n    Then user should be redirected to Login page\r\n\r\n  @Negative @Security\r\n  Scenario: Verify logged out user cannot create account\r\n    Given user logs out from application\r\n    When user accesses Open Account page\r\n    Then user should be redirected to Login page\r\n\r\n  @API @BalanceValidation @ParityCheck\r\n  Scenario:  Verify UI balance matches API balance\r\n    When user fetches account balance from UI\r\n    And user fetches account balance from API\r\n    Then both balances should match\r\n\r\n  @API @AccountValidation\r\n  Scenario: Verify UI account count matches API account count\r\n    When user fetches account count from UI\r\n    And user fetches account count from API\r\n    Then both account counts should match","uri":"features\\accountsBalance.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[{"location":{"line":1,"column":2},"name":"@accounts 3c19a8f6826","text":"both account counts should match","type":"Outcome","astNodeIds":["202e2333-5600-4f29-ac2c-313d4456f702"]}]}},{"source":{"data":"@billpayment\r\nFeature: ParaBank Bill Payment\r\n\r\n  Background:\r\n    Given user is logged into ParaBank\r\n    And user navigates to Bill Payment page\r\n\r\n  #Valid Bill Payment\r\n  @smoke @critical\r\n  Scenario: Successful bill payment with valid details\r\n    When user submits bill payment with \"valid\" data\r\n    Then payment should be successful\r\n\r\n #Mandatory Fields (9 Variants)\r\n  @validation @mandatory\r\n  Scenario: Verify Payee Name is mandatory\r\n    When user submits bill payment with \"Payee Name\" blank\r\n    Then validation message should be displayed for \"Payee Name\"\r\n\r\n  @validation @mandatory\r\n  Scenario: Verify Address is mandatory\r\n    When user submits bill payment with \"Address\" blank\r\n    Then validation message should be displayed for \"Address\"\r\n\r\n  @validation @mandatory\r\n  Scenario: Verify City is mandatory\r\n    When user submits bill payment with \"City\" blank\r\n    Then validation message should be displayed for \"City\"\r\n\r\n  @validation @mandatory\r\n  Scenario: Verify State is mandatory\r\n    When user submits bill payment with \"State\" blank\r\n    Then validation message should be displayed for \"State\"\r\n\r\n  @validation @mandatory\r\n  Scenario: Verify Zip Code is mandatory\r\n    When user submits bill payment with \"Zip Code\" blank\r\n    Then validation message should be displayed for \"Zip Code\"\r\n\r\n  @validation @mandatory\r\n  Scenario: Verify Phone Number is mandatory\r\n    When user submits bill payment with \"Phone Number\" blank\r\n    Then validation message should be displayed for \"Phone Number\"\r\n\r\n  @validation @mandatory\r\n  Scenario: Verify Account Number is mandatory\r\n    When user submits bill payment with \"Account Number\" blank\r\n    Then validation message should be displayed for \"Account Number\"\r\n\r\n  @validation @mandatory\r\n  Scenario: Verify Verify Account is mandatory\r\n    When user submits bill payment with \"Verify Account\" blank\r\n    Then validation message should be displayed for \"Verify Account\"\r\n\r\n  @validation @mandatory\r\n  Scenario: Verify Amount is mandatory\r\n    When user submits bill payment with \"Amount\" blank\r\n    Then validation message should be displayed for \"Amount\"\r\n\r\n  #Account Mismatch\r\n  @accountValidation\r\n  Scenario: Verify account number mismatch validation\r\n    When user submits bill payment with mismatched account numbers\r\n    Then account mismatch validation should be displayed\r\n\r\n #Amount Boundary Checks\r\n  @boundary @amountValidation\r\n  Scenario: Verify payment with minimum valid amount\r\n    When user submits bill payment with amount \"0.01\"\r\n    Then payment should be successful\r\n\r\n  @boundary @amountValidation\r\n  Scenario: Verify payment with zero amount\r\n    When user submits bill payment with amount \"0\"\r\n    Then amount validation should be displayed\r\n\r\n  @boundary @amountValidation\r\n  Scenario: Verify payment with blank amount\r\n    When user submits bill payment with blank amount\r\n    Then amount validation should be displayed\r\n\r\n  @boundary @amountValidation\r\n  Scenario: Verify payment with negative amount\r\n    When user submits bill payment with amount \"-100\"\r\n    Then invalid amount error should be displayed\r\n\r\n  @boundary @amountValidation\r\n  Scenario: Verify payment with amount exceeding balance\r\n    When user submits bill payment with amount exceeding balance\r\n    Then insufficient fund message should be displayed\r\n\r\n #Same Biller Twice\r\n  @repeatPayment\r\n  Scenario: Verify same biller can be paid twice in same session\r\n    When user pays the same biller twice\r\n    Then two successful payment transactions should be recorded\r\n  \r\n  #Batch Payments\r\n  @datadriven @batchPayment\r\n  Scenario: Verify batch bill payment using TypeScript data\r\n    When user performs bill payments using TypeScript data\r\n    Then all bill payments should be successful\r\n    And transaction total should match account activity","uri":"features\\billPayments.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[{"location":{"line":1,"column":1},"name":"@billpayment","id":"ae5c62a4-5415-4bbb-a2b9-bce5ba852544"}],"location":{"line":2,"column":1},"language":"en","keyword":"Feature","name":"ParaBank Bill Payment","description":"","children":[{"background":{"id":"2b5e54e1-047a-42df-b938-6a6e44de1a8a","location":{"line":4,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"1f21a94e-25b1-4810-92ef-d18321a48417","location":{"line":5,"column":5},"keyword":"Given ","keywordType":"Context","text":"user is logged into ParaBank"},{"id":"f5aeec7d-b952-4028-92b2-97735c017b5c","location":{"line":6,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"user navigates to Bill Payment page"}]}},{"scenario":{"id":"01a1b0d8-9b1b-416e-b05d-cd8af4a8582c","tags":[{"location":{"line":9,"column":3},"name":"@smoke","id":"5a6538b3-41be-4698-bb89-ca22430890c1"},{"location":{"line":9,"column":10},"name":"@critical","id":"14e8f858-3413-49e6-b484-bf48e8613285"}],"location":{"line":10,"column":3},"keyword":"Scenario","name":"Successful bill payment with valid details","description":"","steps":[{"id":"069d81e0-a0cf-4125-862d-f29a0477c0b3","location":{"line":11,"column":5},"keyword":"When ","keywordType":"Action","text":"user submits bill payment with \"valid\" data"},{"id":"48823382-4dcc-482b-b694-9e3680483aec","location":{"line":12,"column":5},"keyword":"Then ","keywordType":"Outcome","text":"payment should be successful"}],"examples":[]}},{"scenario":{"id":"005d05ab-9c8b-4c3d-bb3b-874442227ba7","tags":[{"location":{"line":15,"column":3},"name":"@validation","id":"1f795dab-496e-401d-8aba-33d241d5aa4f"},{"location":{"line":15,"column":15},"nam 4f71-89d1-556001fbae86","text":"Registration should not be successful","type":"Outcome","astNodeIds":["ac602ace-6fd2-4d9d-a4f6-abfe0609ee27"]}]}},{"source":{"data":"@fundTransfer\r\nFeature: Fund Transfer - Pay Anyone / Transfer Funds\r\n\r\n  Background:\r\n    Given user is logged into ParaBank\r\n    \r\n  # Core Business Flow\r\n  @smoke @sanity @regression @positive @core\r\n  Scenario: Transfer money between two own accounts\r\n     When user transfers 100 from source account to destination account\r\n     Then transfer should be successful\r\n     And source account balance should decrease by 100\r\n     And destination account balance should increase by 100\r\n\r\n # Boundary Tests\r\n  @boundary @regression\r\n  Scenario: Transfer full available balance\r\n     When user transfers complete available balance\r\n     Then transfer should be successful\r\n     And source account balance should become zero\r\n\r\n  @boundary @regression\r\n  Scenario: Transfer minimum valid amount\r\n     When user transfers 1 amount\r\n     Then transfer should be successful\r\n\r\n  @regression @positive\r\n  Scenario: Transfer amount with two decimal places\r\n     When user transfers 100.50 amount\r\n     Then transfer should be successful\r\n\r\n  @regression @positive\r\n  Scenario: Transfer large amount within available balance\r\n     When user transfers a large valid amount\r\n     Then transfer should be successful\r\n\r\n  # Transaction Verification\r\n  @regression @verification\r\n  Scenario: Verify success confirmation message\r\n     When user performs a valid transfer\r\n     Then success confirmation message should be displayed\r\n\r\n  @regression @verification\r\n  Scenario: Verify transaction id is generated\r\n     When user performs a valid transfer\r\n     Then transaction details should be displayed\r\n\r\n  @regression @ledger\r\n  Scenario: Verify source account debit transaction entry\r\n     When user performs a valid transfer\r\n     Then source account should contain a debit entry\r\n\r\n  @regression @ledger\r\n  Scenario: Verify destination account credit transaction entry\r\n     When user performs a valid transfer\r\n     Then destination account should contain a credit entry\r\n\r\n  @regression @ledger\r\n  Scenario: Verify updated balances after transfer\r\n     When user performs a valid transfer\r\n     Then balances should be updated correctly\r\n\r\n  # Negative Scenarios\r\n  @negative @regression\r\n  Scenario: Transfer amount greater than available balance\r\n     When user transfers amount greater than available balance\r\n     Then transfer should not be successful\r\n\r\n  @negative @regression\r\n  Scenario: Transfer zero amount\r\n     When user enters transfer amount as 0\r\n     Then transfer should not be successful\r\n\r\n  @negative @regression\r\n  Scenario: Transfer negative amount\r\n     When user enters transfer amount as -100\r\n     Then transfer should not be successful\r\n\r\n  @negative @regression\r\n  Scenario: Transfer non numeric amount\r\n     When user enters transfer amount as abc\r\n     Then transfer should not be successful\r\n\r\n  @negative @regression\r\n  Scenario: Transfer special characters as amount\r\n     When user enters transfer amount as @@@\r\n     Then transfer should not be successful\r\n\r\n  @negative @regression\r\n  Scenario: Transfer amount with more than two decimal places\r\n     When user enters transfer amount as 100.999\r\n     Then transfer should not be successful\r\n\r\n  @negative @regression\r\n  Scenario: Transfer from same account to same account\r\n     When user selects same source and destination account\r\n     Then transfer should not be successful\r\n\r\n  # Boundary Scenarios\r\n  @boundary  @regression\r\n  Scenario: Transfer exact available balance\r\n     When user transfers exact available balance\r\n     Then transfer should be successful\r\n     And source account balance should become zero\r\n\r\n  @boundary @regression\r\n  Scenario: Verify account balance after multiple transfers\r\n     When user performs multiple valid transfers\r\n     Then final balance should be calculated correctly\r\n\r\n  # Flagship E2E Scenario (Assessment Main Deliverable)\r\n  @e2e @regression @flagship @assessment @ledger\r\n  Scenario: Customer performs multiple fund transfers in a day\r\n     Given user captures source account opening balance\r\n     When user performs fund transfers with following amounts\r\n     Then all transfers should be successful\r\n     And final balance should equal opening balance minus total transferred amount\r\n     And source account should contain 10 debit entries\r\n     And destination account should contain 10 credit entries\r\n     And total ledger entries should be 20","uri":"features\\transferFund.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[{"location":{"line":1,"column":1},"name":"@fundTransfer","id":"ccbb801c-ac25-4701-9fdc-a1c3b0509b5e"}],"location":{"line":2,"column":1},"language":"en","keyword":"Feature","name":"Fund Transfer - Pay Anyone / Transfer Funds","description":"","children":[{"background":{"id":"dd6c1b93-c76d-4c94-87a2-921f215dabc2","location":{"line":4,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"9429c9ca-8cfb-4c5b-b146-24ceb04ebc74","location":{"line":5,"column":5},"keyword":"Given ","keywordType":"Context","text":"user is logged into ParaBank"}]}},{"scenario":{"id":"b176ad5f-d613-4530-b766-eddb78d30766","tags":[{"location":{"line":8,"column":3},"name":"@smoke","id":"2fcaa234-9e2b-46a1-adfb-7eb2bf86e008"},{"location":{"line":8,"column":10},"name":"@sanity","id":"a92845c6-7734-4373-b2c2-3389c57c2ada"},{"location":{"line":8,"column":18},"name":"@regression","id":"e3982f9e-b17e-426f-840d-4fd3e41114b6"},{"location":{"line":8,"column":30},"name":"@positive","id":"288254c0-5f05-454c-af72-b726fa45ee09"},{"location":{"line":8,"column":40},"name":"@core","id":"b95266cc-76b
